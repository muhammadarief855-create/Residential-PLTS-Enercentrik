<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventory Enercentrik</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#6b7685;--line:#e3e7ed;--ok:#1a7f4b;--warn:#b45309;--bad:#c0262d;--acc:#1f5fbf;--info:#6b4fbb}
  @media (prefers-color-scheme:dark){:root{--bg:#14181e;--card:#1c222b;--ink:#e8ecf2;--mute:#97a2b2;--line:#2b3340;--ok:#4cc38a;--warn:#f0a548;--bad:#ff7a80;--acc:#6ea8ff;--info:#a996f0}}
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);padding:16px 16px 60px;max-width:1100px;margin-inline:auto}
  body.noscroll{overflow:hidden}
  h1{font-size:20px;margin:0 0 2px}
  h2{font-size:17px;margin:0 0 10px}
  h3{font-size:15px;margin:0 0 8px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:10px}
  .mute{color:var(--mute)}
  .small{font-size:12px}
  .status{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--mute)}
  .status.live{color:var(--ok);border-color:var(--ok)}
  .status.err{color:var(--bad);border-color:var(--bad)}
  nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin:6px 0 14px;-webkit-overflow-scrolling:touch}
  nav a{flex:0 0 auto;padding:8px 13px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;text-decoration:none;font-size:14px;white-space:nowrap}
  nav a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
  .pad{padding:14px}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  td.num,th.num{text-align:right;white-space:nowrap}
  td.c,th.c{text-align:center}
  .name{font-weight:500}
  input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
  textarea{min-height:60px;resize:vertical}
  input[readonly]{opacity:.7}
  td input[type=number]{width:90px;text-align:right}
  label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
  .grid .full{grid-column:1/-1}
  .btn{padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:inherit;cursor:pointer}
  .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
  .btn.dng{color:var(--bad)}
  .btn.sm{padding:3px 10px;font-size:12px}
  .btn:disabled{opacity:.55;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row.sp{justify-content:space-between}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{padding:6px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;font:inherit;font-size:13px;cursor:pointer}
  .chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
  .b-ok{color:var(--ok)}.b-low{color:var(--warn)}.b-out{color:var(--bad)}.b-over{color:var(--info)}.b-mute{color:var(--mute)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}
  .stat b{display:block;font-size:24px;line-height:1.2}
  .stat span{font-size:12px;color:var(--mute)}
  .stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}.stat.info b{color:var(--info)}
  .ferr{color:var(--bad);font-size:13px;margin-top:8px;min-height:0}
  .ferr:empty{display:none}
  .hint{font-size:12px;color:var(--mute);margin-top:3px}
  .empty{padding:24px;text-align:center;color:var(--mute)}
  .notice{padding:10px 14px;border:1px solid var(--warn);color:var(--warn);border-radius:8px;margin-bottom:14px;font-size:13px}
  #overlay,#cbox{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px 12px;z-index:50}
  #cbox{z-index:60}
  #overlay[hidden],#cbox[hidden]{display:none}
  .modal{background:var(--card);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;padding:16px;margin:auto}
  .modal.wide{max-width:760px}
  .modal h2{margin-bottom:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-bottom:12px}
  .kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:500}
  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:70;max-width:90vw}
  #toast.show{opacity:.95}
  .pcard{display:block;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;color:inherit;text-decoration:none}
  .pcard:last-child{border-bottom:0}
  .pcard:hover{background:var(--bg)}
  .grp td{background:var(--bg);font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.03em}
  .pick{max-height:380px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .pick th{position:sticky;top:0;background:var(--card);z-index:1}
  .pick tr.sel td{background:rgba(31,95,191,.10)}
  .pick tr[data-prow] td.name{cursor:pointer}
  input[type=checkbox]{width:18px;height:18px;vertical-align:middle}
  #printArea{display:none}
  @media print{
    body>*:not(#printArea){display:none !important}
    #printArea{display:block !important}
    body{background:#fff !important;color:#000 !important;padding:0;max-width:none;font-size:11px}
    #printArea *{color:#000 !important;background:transparent !important}
    #printArea h1{font-size:16px;margin:0 0 2px}
    #printArea .psub{font-size:11px;margin-bottom:8px}
    #printArea table{width:100%;border-collapse:collapse;font-size:10.5px}
    #printArea th,#printArea td{border:1px solid #888;padding:3px 5px;text-align:left;vertical-align:top;text-transform:none;letter-spacing:0}
    #printArea th{font-weight:700;background:#eee !important}
    #printArea td.r,#printArea th.r{text-align:right}
    #printArea thead{display:table-header-group}
    #printArea tr{page-break-inside:avoid}
    #printArea .pfoot{margin-top:8px;font-size:10px}
  }
  @media (max-width:640px){.hide-s{display:none}body{padding:12px 10px 60px}td input[type=number]{width:70px}}
</style>
</head>
<body>
<header>
  <h1>Inventory Enercentrik</h1>
  <div class="sub">BHP Atas &amp; BHP Bawah · data tersimpan di Google Sheets <span id="st" class="status">memuat…</span> <button class="btn sm" id="btnRefresh">Segarkan</button></div>
</header>
<nav id="nav"></nav>
<main id="app"><div class="card"><div class="empty">Memuat data…</div></div></main>
<div id="overlay" hidden><div class="modal" id="mbox"></div></div>
<div id="cbox" hidden><div class="modal" id="cbody"></div></div>
<div id="toast"></div>
<div id="printArea"></div>
<style id="pgstyle"></style>

<script>
// ====== ISI DENGAN URL WEB APP DARI APPS SCRIPT (berakhiran /exec) ======
var API_URL = "https://script.google.com/macros/s/AKfycbxC-QKw9FjqGUiSjM0qU2CO84-REzXFQdAbdhGJmknbRT2N2MlCZFIqboXC0LSFnhTZOg/exec";
// ========================================================================

(function () {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('id-ID');
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const ls = { get(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }, del(k) { try { localStorage.removeItem(k); } catch (e) {} } };

const PAGES = [['dashboard', 'Dashboard'], ['master', 'Master Inventory'], ['in', 'Stock In'], ['out', 'Stock Out'],
  ['project', 'Project'], ['opname', 'Stock Opname'], ['history', 'Transaction History']];
const UNITS = ['Pcs', 'Unit', 'Meter', 'Set', 'Batang', 'Pair', 'Roll', 'Box'];
const SUMBER = ['Pembelian', 'Retur Proyek', 'Lainnya'];
const TUJUAN = ['Alokasi ke Proyek', 'Pemakaian Langsung', 'Dijual', 'Rusak / Hilang', 'Lainnya'];
const JENIS = ['Stock In', 'Stock Out', 'Project Transfer', 'Project Return', 'Project Usage', 'Stock Adjustment'];

let D = null, page = 'dashboard', arg = '';
const F = { master: { cat: 'all', q: '', st: 'all', arch: false }, hist: { from: '', to: '', mid: '', jenis: '', pid: '', q: '' }, proj: { st: 'all' }, opCat: 'all' };
const TF = { in: { from: '', to: '' }, out: { from: '', to: '' } };
const HSEL = new Set();
const reqs = {};
const rid = k => reqs[k] || (reqs[k] = uid());
const rdone = k => { delete reqs[k]; };

// ---------- status stok ----------
function stat(m) {
  if (m.kantor <= 0) return 'out';
  if (m.min > 0 && m.kantor <= m.min) return 'low';
  if (m.max > 0 && m.kantor > m.max) return 'over';
  return 'ok';
}
const ST = { ok: ['Normal', 'b-ok'], low: ['Low Stock', 'b-low'], out: ['Out of Stock', 'b-out'], over: ['Overstock', 'b-over'] };
const badge = k => '<span class="badge ' + ST[k][1] + '">' + ST[k][0] + '</span>';
function buyQty(m) { const s = stat(m); return ((s === 'low' || s === 'out') && m.max > 0) ? Math.max(0, m.max - m.kantor) : null; }
const matById = id => D.materials.find(m => m.id === id);
const projById = id => D.projects.find(p => p.id === id);
const activeMats = () => D.materials.filter(m => m.active);
const label = m => m.name + (m.spec ? ' — ' + m.spec : '');

// ---------- status, toast, modal ----------
function setStatus(t, cls) { const s = $('#st'); s.textContent = t; s.className = 'status' + (cls ? ' ' + cls : ''); }
function stamp() { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
let toastT;
function toast(t, ms) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), ms || 2600); }
function openModal(html, wide) { const b = $('#mbox'); b.className = 'modal' + (wide ? ' wide' : ''); b.innerHTML = html; $('#overlay').hidden = false; document.body.classList.add('noscroll'); const f = $('input:not([type=hidden]):not([readonly]),select', b); if (f) f.focus(); }
function closeModal() { $('#overlay').hidden = true; $('#mbox').innerHTML = ''; document.body.classList.remove('noscroll'); }
function confirmBox(title, pairs, okLabel) {
  return new Promise(res => {
    const kv = pairs.filter(p => p[1] !== '' && p[1] != null).map(p => '<dt>' + esc(p[0]) + '</dt><dd>' + esc(p[1]) + '</dd>').join('');
    $('#cbody').innerHTML = '<h2>' + esc(title) + '</h2><dl class="kv">' + kv + '</dl><div class="row sp"><button class="btn" data-c="0">Batal</button><button class="btn pri" data-c="1">' + esc(okLabel || 'Simpan') + '</button></div>';
    $('#cbox').hidden = false;
    $('#cbody').onclick = e => { const b = e.target.closest('button[data-c]'); if (!b) return; $('#cbox').hidden = true; res(b.dataset.c === '1'); };
  });
}

// ---------- komunikasi dengan Google Sheets ----------
function getPin(force) {
  let p = ls.get('imsPin');
  if (!p || force) {
    p = window.prompt(force ? 'PIN salah. Masukkan PIN lagi:' : 'Masukkan PIN untuk menyimpan perubahan:');
    if (p === null) return null;
    ls.set('imsPin', p);
  }
  return p;
}
async function postJSON(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
async function act(action, payload) {
  const ok = (API_URL && API_URL.indexOf('PASTE_') !== 0);
  if (!ok) throw new Error('API_URL belum diisi di index.html');
  let pin = getPin(false);
  if (pin === null) throw new Error('PIN dibatalkan');
  setStatus('menyimpan…');
  const body = Object.assign({ action: action, pin: pin }, payload);
  let j;
  try {
    j = await postJSON(body);
    if (!j.ok && j.error === 'PIN') {
      ls.del('imsPin'); pin = getPin(true);
      if (pin === null) { setStatus('belum tersimpan', 'err'); throw new Error('PIN dibatalkan'); }
      body.pin = pin; j = await postJSON(body);
    }
  } catch (e) {
    if (e.message === 'PIN dibatalkan') throw e;
    setStatus('koneksi gagal', 'err');
    throw new Error('Koneksi gagal — data belum tentu tersimpan. Tekan Simpan sekali lagi (aman, tidak akan tercatat ganda).');
  }
  if (!j.ok) {
    setStatus('gagal menyimpan', 'err');
    if (j.error !== 'ADMIN_PIN') load(true);
    throw new Error(j.error === 'PIN' ? 'PIN salah' : j.error === 'ADMIN_PIN' ? 'PIN administrator salah' : j.error);
  }
  D = j.data; setStatus('tersimpan ' + stamp(), 'live');
  if (j.result && j.result.duplicate) toast('Transaksi ini sudah tersimpan sebelumnya (tidak digandakan)');
  return j.result || {};
}
async function load(silent) {
  if (!API_URL || API_URL.indexOf('PASTE_') === 0) { setStatus('API_URL belum diisi', 'err'); return; }
  if (!silent) setStatus('memuat…');
  try {
    const r = await fetch(API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'gagal');
    if (!j.data || !Array.isArray(j.data.materials)) throw new Error('OLD_SCRIPT');
    D = j.data; setStatus('terbaru ' + stamp(), 'live');
    if (!isEditing()) render();
  } catch (e) {
    if (e.message === 'OLD_SCRIPT') {
      setStatus('Apps Script belum diperbarui', 'err');
      $('#app').innerHTML = '<div class="card pad"><h2>Skrip di Google Sheets masih versi lama</h2><p>Halaman ini sudah versi baru, tetapi Web app Apps Script yang dipanggil masih memakai <code>Code.gs</code> lama, jadi data belum bisa ditampilkan.</p><ol><li>Buka Google Sheet → <b>Extensions → Apps Script</b>.</li><li>Ganti seluruh isi editor dengan <code>Code.gs</code> yang baru (jangan lupa mengisi <code>KUNCI</code> dan <code>KUNCI_ADMIN</code>), lalu <b>Save</b>.</li><li><b>Deploy → Manage deployments →</b> ikon pensil <b>→ Version: New version → Deploy</b>.</li><li>Kembali ke halaman ini dan tekan <b>Segarkan</b>.</li></ol></div>';
    } else {
      setStatus('gagal memuat data', 'err');
      if (!D) $('#app').innerHTML = '<div class="card"><div class="empty">Data tidak bisa dimuat. Periksa URL Web app dan koneksi, lalu tekan Segarkan.</div></div>';
    }
  }
}
function isEditing() {
  if (!$('#overlay').hidden) return true;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#app').contains(a)) return true;
  return $$('#app [data-pick]:checked').length > 0;
}

// ---------- komponen form ----------
function matSelect(name, o) {
  o = o || {};
  const list = (o.list || activeMats());
  let h = '<select name="' + name + '" required data-matsel data-mode="' + (o.mode || 'kantor') + '"' + (o.pid ? ' data-pid="' + esc(o.pid) + '"' : '') + '><option value="">— pilih material —</option>';
  ['BHP Atas', 'BHP Bawah'].forEach(cat => {
    const ms = list.filter(m => m.cat === cat); if (!ms.length) return;
    h += '<optgroup label="' + cat + '">' + ms.map(m => '<option value="' + esc(m.id) + '"' + (o.sel === m.id ? ' selected' : '') + '>' + esc(label(m)) + ' (' + esc(m.unit) + ')</option>').join('') + '</optgroup>';
  });
  return h + '</select>';
}
function projSelect(name, o) {
  o = o || {};
  const ps = D.projects.filter(p => !p.legacy && (o.all || p.status !== 'Completed'));
  return '<select name="' + name + '"' + (o.required ? ' required' : '') + ' data-projsel><option value="">' + (o.blank || '— pilih proyek —') + '</option>' +
    ps.map(p => '<option value="' + esc(p.id) + '"' + (o.sel === p.id ? ' selected' : '') + '>' + esc(p.name) + ' (' + p.status + ')</option>').join('') + '</select>';
}
const opts = (arr, sel) => arr.map(x => '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
const field = (lab, inner, cls) => '<div class="' + (cls || '') + '"><label>' + lab + '</label>' + inner + '</div>';
const picField = () => field('PIC', '<input type="text" name="pic" required maxlength="60" value="' + esc(ls.get('imsPic')) + '" placeholder="Nama petugas" autocomplete="name">');

function updateHint(form) {
  const sel = $('[data-matsel]', form); if (!sel) return;
  const m = matById(sel.value), u = $('[name=unit]', form), h = $('[data-hint]', form);
  if (u) u.value = m ? m.unit : '';
  if (h) {
    if (!m) { h.textContent = ''; return; }
    if (sel.dataset.mode === 'proj') { const e = D.pm.find(x => x.pid === sel.dataset.pid && x.mid === m.id); h.textContent = 'Sisa di proyek: ' + fmt(e ? e.sisa : 0) + ' ' + m.unit; }
    else if (sel.dataset.mode === 'kantor') h.textContent = 'Stok kantor tersedia: ' + fmt(m.kantor) + ' ' + m.unit;
    else h.textContent = '';
  }
}
function ferr(form, msg) { const e = $('.ferr', form); if (e) e.textContent = msg || ''; }
async function guarded(form, fn) {
  const btns = $$('button', form); btns.forEach(b => b.disabled = true); ferr(form, '');
  try { await fn(); } catch (e) { ferr(form, e.message); } finally { btns.forEach(b => b.disabled = false); }
}
const fd = form => { const o = {}; new FormData(form).forEach((v, k) => { o[k] = v; }); return o; };

// ---------- halaman: Dashboard ----------
function pgDashboard() {
  const am = activeMats(), low = am.filter(m => stat(m) === 'low'), out = am.filter(m => stat(m) === 'out'), over = am.filter(m => stat(m) === 'over');
  const onProj = am.filter(m => m.proyek > 0);
  const totalKantor = am.reduce((a, m) => a + m.kantor, 0), totalProj = am.reduce((a, m) => a + m.proyek, 0);
  const activeP = D.projects.filter(p => p.status === 'Ongoing').length;
  const d30 = new Date(); d30.setDate(d30.getDate() - 30); const cut = d30.getFullYear() + '-' + pad(d30.getMonth() + 1) + '-' + pad(d30.getDate());
  const inn = D.history.filter(h => h.jenis === 'Stock In' && h.tanggal >= cut), outt = D.history.filter(h => h.jenis === 'Stock Out' && h.tanggal >= cut);
  const sum = a => a.reduce((x, h) => x + h.qty, 0);
  let h = '<div class="stats">' +
    '<div class="stat"><b>' + am.length + '</b><span>Total jenis material</span></div>' +
    '<div class="stat"><b>' + fmt(totalKantor) + '</b><span>Total stok tersedia di kantor (semua satuan)</span></div>' +
    '<div class="stat warn"><b>' + low.length + '</b><span>Low Stock</span></div>' +
    '<div class="stat bad"><b>' + out.length + '</b><span>Out of Stock</span></div>' +
    '<div class="stat info"><b>' + over.length + '</b><span>Overstock</span></div>' +
    '<div class="stat"><b>' + activeP + '</b><span>Proyek aktif (Ongoing)</span></div>' +
    '<div class="stat"><b>' + onProj.length + '</b><span>Material di proyek · total ' + fmt(totalProj) + '</span></div></div>';
  h += '<div class="stats">' +
    '<div class="stat"><b>' + inn.length + ' trx · ' + fmt(sum(inn)) + '</b><span>Barang masuk (30 hari)</span></div>' +
    '<div class="stat"><b>' + outt.length + ' trx · ' + fmt(sum(outt)) + '</b><span>Barang keluar (30 hari)</span></div></div>';
  const need = low.concat(out).sort((a, b) => a.name.localeCompare(b.name));
  h += '<div class="card"><div class="pad"><h2>Perlu perhatian</h2></div>';
  if (!need.length && !over.length) h += '<div class="empty">Semua stok dalam batas aman.</div>';
  else {
    h += '<div class="tw"><table><thead><tr><th>Material</th><th>Status</th><th class="num">Stok kantor</th><th class="num hide-s">Min</th><th class="num hide-s">Max</th><th class="num">Saran beli</th></tr></thead><tbody>';
    need.concat(over).forEach(m => {
      const b = buyQty(m);

    });
    h += '</tbody></table></div>';
  }
  h += '</div><div class="card"><div class="pad"><h2>Transaksi terbaru</h2></div>' + histTable(D.history.slice(0, 8), true) + '</div>';
  $('#app').innerHTML = h;
}

function pickBox(mode) {

  let h = '<div class="row sp" style="margin-bottom:8px"><div class="row" style="flex:1">' +

    '<span class="small mute" data-pickcount>0 material dipilih</span></div>';
  h += '<div class="pick"><table><thead><tr><th class="c"></th><th>Material</th><th class="num">Jumlah</th></tr></thead><tbody>';
  ms.forEach(m => {

      '<td class="name">' + esc(label(m)) + '<div class="small mute">' + esc(m.cat) + ' · stok kantor ' + fmt(m.kantor) + ' ' + esc(m.unit) + (off ? ' (habis)' : '') + '</div></td>' +
      '<td class="num"><input type="number" data-qty step="any" min="0" inputmode="decimal" disabled> <span class="small mute">' + esc(m.unit) + '</span></td></tr>';

}
function pickCount(form) { const n = $$('[data-pick]:checked', form).length, c = $('[data-pickcount]', form); if (c) c.textContent = n + ' material dipilih'; }
function pickToggle(cb) {
  const tr = cb.closest('tr'), q = $('[data-qty]', tr);
  q.disabled = !cb.checked; tr.classList.toggle('sel', cb.checked);
  if (cb.checked) q.focus(); else q.value = '';
  pickCount(cb.closest('form'));
}
function pickFilter(form) {
  const q = $('[data-pickq]', form).value.toLowerCase().trim(), cat = $('[data-pcat]', form).value;
  $$('tr[data-prow]', form).forEach(tr => { tr.hidden = !((!q || tr.dataset.text.includes(q)) && (!cat || tr.dataset.cat === cat)); });
}
function pickItems(form) {
  const items = [];
  $$('tr[data-prow]', form).forEach(tr => { if ($('[data-pick]', tr).checked) items.push({ materialId: tr.dataset.mid, qty: $('[data-qty]', tr).value }); });
  return items;
}

    (!f.pid || h.pid === f.pid) && (!q || (h.nama + ' ' + h.spec + ' ' + h.ket + ' ' + h.id + ' ' + h.pic).toLowerCase().includes(q)));

function exportCSV() {

async function delTxns(ids, title, pairs) {

  else if (t.dataset.f === 'hq') { F.hist.q = t.value; const pos = t.selectionStart; pgHistory(); const n = $('[data-f=hq]'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.dataset.k === 'fisik') { const tr = t.closest('tr'), sel = $('[data-k=sel]', tr); if (t.value === '') { sel.textContent = '—'; sel.style.color = ''; return; } const d = Math.round((Number(t.value) - Number(tr.dataset.sis)) * 10000) / 10000; sel.textContent = (d > 0 ? '+' : '') + fmt(d); sel.style.color = d === 0 ? 'var(--ok)' : d > 0 ? 'var(--info)' : 'var(--warn)'; }
  else if (t.dataset.k === 'used' || t.dataset.k === 'ret') { const tr = t.closest('tr'), u = Number($('[data-k=used]', tr).value) || 0, r = Number($('[data-k=ret]', tr).value) || 0, left = Math.round((Number(tr.dataset.sisa) - u - r) * 10000) / 10000; const c = $('[data-k=left]', tr); c.textContent = fmt(left); c.style.color = left < 0 ? 'var(--bad)' : ''; }
});
document.addEventListener('change', e => {
  const t = e.target, f = t.dataset.f;
  if (t.dataset.pick !== undefined) pickToggle(t);
  else if (t.dataset.pcat !== undefined) pickFilter(t.closest('form'));
  else if (t.dataset.hsel !== undefined) { if (t.checked) HSEL.add(t.value); else HSEL.delete(t.value); updateHsel(); }
  else if (t.dataset.hall !== undefined) { $$('[data-hsel]').forEach(c => { c.checked = t.checked; if (t.checked) HSEL.add(c.value); else HSEL.delete(c.value); }); updateHsel(); }
  else if (f === 'tfrom' || f === 'tto') { TF[t.dataset.kind][f === 'tfrom' ? 'from' : 'to'] = t.value; $('#txlist').innerHTML = txListInner(t.dataset.kind); }
  else if (f === 'mst') { F.master.st = t.value; pgMaster(); }
  else if (f === 'march') { F.master.arch = t.checked; pgMaster(); }
  else if (f === 'opcat') { F.opCat = t.value; pgOpname(); }
  else if (f && f[0] === 'h' && f !== 'hq') { const k = { hfrom: 'from', hto: 'to', hmid: 'mid', hjenis: 'jenis', hpid: 'pid' }[f]; F.hist[k] = t.value; pgHistory(); }
  else if (t.matches('[data-matsel]')) updateHint(t.closest('form'));
  else if (t.name === 'purge') { const f = t.closest('form'), bx = $('[data-purgebox]', f); bx.hidden = !t.checked; $('[name=approver]', f).required = t.checked; $('[name=adminPin]', f).required = t.checked; }
  else if (t.name === 'tujuan') { const p = $('[name=projectId]', t.closest('form')); if (p) p.required = t.value === 'Alokasi ke Proyek'; }
});
document.addEventListener('click', e => {
  const nm = e.target.closest('tr[data-prow] td.name');
  if (nm) { const cb = $('[data-pick]', nm.parentNode); if (cb && !cb.disabled) { cb.checked = !cb.checked; pickToggle(cb); } return; }
  const b = e.target.closest('[data-a]'); if (!b) { if (e.target === $('#overlay')) closeModal(); return; }
  const a = b.dataset.a, v = b.dataset.v;
  if (a === 'close') closeModal();
  else if (a === 'mcat') { F.master.cat = v; pgMaster(); }
  else if (a === 'madd') masterForm(null);
  else if (a === 'medit') masterForm(matById(v));
  else if (a === 'march') { const form = b.closest('form'); guarded(form, async () => { await act('setMaterialActive', { id: v, active: b.dataset.on === '1' }); closeModal(); toast('Tersimpan'); render(); }); }
  else if (a === 'mdel') { const m = matById(v), form = b.closest('form'); guarded(form, async () => { if (!(await confirmBox('Hapus material?', [['Material', label(m)], ['Catatan', 'Dihapus permanen dari Google Sheets']], 'Hapus'))) return; await act('deleteMaterial', { id: v }); closeModal(); toast('Material dihapus'); render(); }); }
  else if (a === 'pst') { F.proj.st = v; pgProject(); }
  else if (a === 'padd') projForm(null);
  else if (a === 'pedit') projForm(projById(v));
  else if (a === 'ptr' || a === 'puse' || a === 'pret') projMoveForm(a === 'ptr' ? 'tr' : a === 'puse' ? 'use' : 'ret', v);
  else if (a === 'pcomp') projCompleteForm(v);
  else if (a === 'pdel') projDeleteForm(v);
  else if (a === 'oadj') adjustForm(D.opname.find(o => o.id === v), b.dataset.m);
  else if (a === 'hreset') { F.hist = { from: '', to: '', mid: '', jenis: '', pid: '', q: '' }; pgHistory(); }
  else if (a === 'hcsv') exportCSV();
  else if (a === 'pdf') exportPdf(v);
  else if (a === 'inedit' || a === 'outedit') { const r = (a === 'inedit' ? D.stockin : D.stockout).find(x => x.trx === v); if (r) (a === 'inedit' ? editInForm : editOutForm)(r); }
  else if (a === 'indel' || a === 'outdel') { const r = (a === 'indel' ? D.stockin : D.stockout).find(x => x.trx === v); if (r) delTxns([v], a === 'indel' ? 'Hapus barang masuk?' : 'Hapus barang keluar?', [['ID', r.id], ['Tanggal', r.tanggal], ['Material', r.nama], ['Jumlah', fmt(r.qty) + ' ' + r.unit], ['Proyek', r.proyek]]); }
  else if (a === 'hdel') { const x = D.history.find(h => h.id === v); if (x) delTxns([v], 'Hapus transaksi?', [['ID', x.id], ['Jenis', x.jenis], ['Material', x.nama], ['Jumlah', fmt(x.qty) + ' ' + x.unit], ['Tanggal', x.tanggal], ['Proyek', x.proyek]]); }
  else if (a === 'hdelsel') { if (HSEL.size) delTxns(Array.from(HSEL), 'Hapus ' + HSEL.size + ' transaksi?', [['Jumlah transaksi', String(HSEL.size)]]); }
});
$('#btnRefresh').addEventListener('click', () => load());
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(true); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#overlay').hidden && $('#cbox').hidden) closeModal();
  if (e.key === 'Enter' && e.target.matches && e.target.matches('[data-pickq]')) e.preventDefault();
});

// ---------- event: submit form ----------
const SUBMIT = {
  async master(form) {
    const o = fd(form), id = form.dataset.id, unit = o.unitSel === '__o' ? (o.unitOther || '').trim() : o.unitSel;
    if (!unit) throw new Error('Satuan wajib diisi');
    const payload = { name: o.name, cat: o.cat, spec: o.spec, unit: unit, awal: o.awal, min: o.min, max: o.max, loc: o.loc, note: o.note };
    if (id) { await act('updateMaterial', Object.assign({ id: id }, payload)); }
    else { const k = 'mat:' + o.name; await act('addMaterial', Object.assign({ requestId: rid(k) }, payload)); rdone(k); }
    closeModal(); toast('Material tersimpan'); render();
  },
  async 'in'(form) {
    const o = fd(form), items = pickItems(form);
    if (!items.length) throw new Error('Centang minimal satu material');
    const lines = items.map(it => {
      const m = matById(it.materialId), q = Number(it.qty);
      if (!(q > 0)) throw new Error('Isi jumlah untuk "' + label(m) + '"');
      return [label(m), '+' + fmt(q) + ' ' + m.unit + ' → stok jadi ' + fmt(m.kantor + q)];
    });
    if (!(await confirmBox('Simpan ' + items.length + ' barang masuk?', [['Tanggal', o.tanggal], ['Sumber', o.sumber], ['Supplier', o.supplier], ['PIC', o.pic]].concat(lines)))) return;
    ls.set('imsPic', o.pic); const k = 'in:' + JSON.stringify([o.tanggal, o.sumber, items]);
    await act('stockInBatch', { requestId: rid(k), items: items, tanggal: o.tanggal, sumber: o.sumber, supplier: o.supplier, pic: o.pic, note: o.note });
    rdone(k); toast(items.length + ' barang masuk tersimpan'); render();
  },
  async out(form) {
    const o = fd(form), items = pickItems(form);
    if (!items.length) throw new Error('Centang minimal satu material');
    if (o.tujuan === 'Alokasi ke Proyek' && !o.projectId) throw new Error('Pilih proyek untuk alokasi');
    const pj = projById(o.projectId);
    const lines = items.map(it => {
      const m = matById(it.materialId), q = Number(it.qty);
      if (!(q > 0)) throw new Error('Isi jumlah untuk "' + label(m) + '"');
      if (q > m.kantor) throw new Error('Jumlah "' + label(m) + '" melebihi stok kantor (' + fmt(m.kantor) + ' ' + m.unit + ')');
      return [label(m), '-' + fmt(q) + ' ' + m.unit + ' → stok jadi ' + fmt(m.kantor - q)];
    });
    if (!(await confirmBox('Simpan ' + items.length + ' barang keluar?', [['Tanggal', o.tanggal], ['Tujuan', o.tujuan], ['Proyek', pj ? pj.name : ''], ['PIC', o.pic]].concat(lines)))) return;
    ls.set('imsPic', o.pic); const k = 'out:' + JSON.stringify([o.tanggal, o.tujuan, o.projectId, items]);
    await act('stockOutBatch', { requestId: rid(k), items: items, tanggal: o.tanggal, tujuan: o.tujuan, projectId: o.projectId, pic: o.pic, note: o.note });
    rdone(k); toast(o.tujuan === 'Alokasi ke Proyek' ? items.length + ' material dialokasikan ke proyek' : items.length + ' barang keluar tersimpan'); render();
  },
  async editin(form) {
    const o = fd(form);
    await act('updateStockIn', { trx: form.dataset.trx, qty: o.qty, tanggal: o.tanggal, sumber: o.sumber, supplier: o.supplier, pic: o.pic, note: o.note });
    ls.set('imsPic', o.pic); closeModal(); toast('Perubahan tersimpan'); render();
  },
  async editout(form) {
    const o = fd(form);
    await act('updateStockOut', { trx: form.dataset.trx, qty: o.qty, tanggal: o.tanggal, tujuan: o.tujuan, projectId: o.projectId, pic: o.pic, note: o.note });
    ls.set('imsPic', o.pic); closeModal(); toast('Perubahan tersimpan'); render();
  },
  async proj(form) {
    const o = fd(form), id = form.dataset.id;
    if (id) { await act('updateProject', { id: id, name: o.name, lokasi: o.lokasi, mulai: o.mulai, pic: o.pic, status: o.status, note: o.note }); }
    else { const k = 'proj:' + o.name; await act('createProject', { requestId: rid(k), name: o.name, lokasi: o.lokasi, mulai: o.mulai, pic: o.pic, status: o.status, note: o.note }); rdone(k); }
    closeModal(); toast('Proyek tersimpan'); render();
  },
  async pmove(form) {
    const o = fd(form), kind = form.dataset.kind, pid = form.dataset.pid, m = matById(o.materialId); if (!m) throw new Error('Pilih material');
    const action = { tr: 'transfer', use: 'usage', ret: 'returnToOffice' }[kind], p = projById(pid);
    if (!(await confirmBox({ tr: 'Bawa material ke proyek?', use: 'Catat pemakaian?', ret: 'Kembalikan ke kantor?' }[kind], [['Proyek', p.name], ['Material', label(m)], ['Jumlah', fmt(o.qty) + ' ' + m.unit], ['PIC', o.pic]]))) return;
    ls.set('imsPic', o.pic); const k = 'pm:' + kind + pid;
    await act(action, { requestId: rid(k), projectId: pid, materialId: o.materialId, qty: o.qty, tanggal: o.tanggal, pic: o.pic, note: o.note });
    rdone(k); closeModal(); toast('Tersimpan'); render();
  },
  async pcomp(form) {
    const o = fd(form), pid = form.dataset.pid, p = projById(pid), items = [];
    $$('tbody tr', form).forEach(tr => {
      const u = Number($('[data-k=used]', tr).value) || 0, r = Number($('[data-k=ret]', tr).value) || 0, sisa = Number(tr.dataset.sisa);
      if (u < 0 || r < 0) throw new Error('Jumlah tidak boleh negatif');
      if (u + r > sisa + 0.00001) throw new Error('Digunakan + dikembalikan melebihi sisa di proyek');
      if (u > 0 || r > 0) items.push({ materialId: tr.dataset.mid, used: u, returned: r });
    });
    const left = $$('tbody tr', form).filter(tr => (Number(tr.dataset.sisa) - (Number($('[data-k=used]', tr).value) || 0) - (Number($('[data-k=ret]', tr).value) || 0)) > 0.00001).length;
    if (!(await confirmBox('Selesaikan proyek?', [['Proyek', p.name], ['Tanggal selesai', o.tanggal], ['Material dicatat', items.length + ' baris'], ['Masih di proyek', left ? left + ' material tetap tercatat sebagai stok proyek' : 'Tidak ada'], ['Catatan', 'Proyek akan masuk arsip Completed']], 'Selesaikan'))) return;
    ls.set('imsPic', o.pic); const k = 'pc:' + pid;
    await act('completeProject', { requestId: rid(k), id: pid, tanggal: o.tanggal, pic: o.pic, items: items });
    rdone(k); closeModal(); toast('Proyek selesai'); render();
  },
  async pdel(form) {
    const o = fd(form), pid = form.dataset.pid, p = projById(pid), purge = o.purge === 'on';
    if (!(await confirmBox(purge ? 'Hapus proyek BESERTA transaksinya?' : 'Hapus proyek?', [['Proyek', p.name], ['Transaksi di histori', purge ? 'IKUT DIHAPUS, stok kembali seperti sebelum proyek' : 'tetap ada'], ['Catatan', 'Tidak bisa dibatalkan']], 'Hapus'))) return;
    const r = await act('deleteProject', { id: pid, purge: purge, approver: o.approver, adminPin: o.adminPin });
    closeModal(); location.hash = '#project'; toast('Proyek dihapus' + (r.purged ? ' (' + r.removedTransactions + ' transaksi ikut dihapus)' : '')); render();
  },
  async opname(form) {
    const o = fd(form), items = [];
    $$('tbody tr', form).forEach(tr => { const f = $('[data-k=fisik]', tr).value; if (f !== '') items.push({ materialId: tr.dataset.mid, fisik: f, ket: $('[data-k=ket]', tr).value }); });
    if (!items.length) throw new Error('Isi minimal satu stok fisik');
    const diff = items.filter(i => Math.abs(Number(i.fisik) - Number($('tr[data-mid="' + i.materialId + '"]', form).dataset.sis)) > 0.00001).length;
    if (!(await confirmBox('Simpan hasil opname?', [['Tanggal', o.tanggal], ['PIC', o.pic], ['Material diperiksa', String(items.length)], ['Ada selisih', String(diff)], ['Catatan', 'Stok tidak berubah sebelum adjustment disetujui']]))) return;
    ls.set('imsPic', o.pic); const k = 'opname';
    const r = await act('opname', { requestId: rid(k), tanggal: o.tanggal, pic: o.pic, items: items });
    rdone(k); toast('Opname tersimpan' + (r.selisih ? ' — ' + r.selisih + ' selisih menunggu adjustment' : '')); render();
  },
  async adjust(form) {
    const o = fd(form), id = form.dataset.id;
    await act('adjust', { opnameId: id, mode: form.dataset.mode, approver: o.approver, adminPin: o.adminPin, pic: o.pic, note: o.note });
    ls.set('imsPic', o.pic); closeModal(); toast(form.dataset.mode === 'adjust' ? 'Adjustment disetujui' : 'Selisih diabaikan'); render();
  }
};
document.addEventListener('submit', e => {
  const form = e.target; if (!form.dataset.form) return;
  e.preventDefault();
  guarded(form, () => SUBMIT[form.dataset.form](form));
});

route(); load();
})();
</script>
</body>
</html>
